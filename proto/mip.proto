syntax = "proto3";

package vnet.protocol.mip;

message PacketSwitchMIP {
    string name     = 1;
    string auth_key = 2;
    string network  = 3;

    uint32 port = 4;

    // Fingerprint of the switch config; every switch must hold the same.
    string config_hash = 5;

    // Address agents and peers should dial, when the one the conductor
    // sees is not it (NAT, several interfaces). 0 = use the peer address.
    fixed32 advertise_ipv4 = 6;
}

// Switch to conductor: the fingerprint of the config it applies, sent
// after a reload of its own file and after a config pushed by the
// conductor was applied (or refused, in which case the old fingerprint
// is repeated).
message PacketSwitchConfig {
    string config_hash = 1;
}

// Conductor to switch: the switch config as text, in one or more pieces,
// so a file larger than one frame still fits. Pieces arrive in order on
// the conductor link; the switch collects them and parses the whole
// when the last one arrives.
message PacketConfigPush {
    // Fingerprint of the parsed config the pieces add up to.
    string config_hash = 1;
    // Position of this piece, 0 for the first.
    uint32 index = 2;
    // True on the last piece.
    bool   last = 3;
    // A slice of the config file.
    bytes  text = 4;
}

message PacketAgentMIP {
    string name     = 1;
    string auth_key = 2;
    string network  = 3;
}

message PacketConnectToSwitch {
    string  switch_name = 1;
    fixed32 switch_ipv4 = 2;

    fixed64 connection_token = 3;

    uint32  switch_port = 4;
}

message PacketAgentConnectionToken {
    string  agent_name       = 1;
    fixed64 connection_token = 2;
}

message PacketAuthConnectToSwitch {
    fixed64 connection_token = 1;
}

message PacketConnectionAccepted {
    fixed32 virtual_ipv4 = 1;
}

message PacketAgentMRP {
    string name     = 1;
    string auth_key = 2;
}

message PacketAgentRegistered {
    string agent_name    = 1;
    fixed32 virtual_ipv4 = 2;
}

message PacketSwitchRouteUpdate {
    string switch_name  = 1;
    fixed32 switch_ipv4 = 2;
    uint32 switch_port  = 3;
    fixed32 agent_ipv4  = 4;
}

message PacketSwitchDisconnected {
    string switch_name = 1;
}

message PacketSwitchHello {
    string  switch_name = 1;
    // The token the conductor issued for this pair of switches.
    fixed64 peer_token  = 2;
}

// Conductor to switch: the token the switch named peer_name will present,
// or must be shown, when the two connect.
message PacketPeerToken {
    string  peer_name = 1;
    fixed64 token     = 2;
}

message PacketAgentUnregistered {
    string agent_name    = 1;
    fixed32 virtual_ipv4 = 2;
    string switch_name   = 3;
}
