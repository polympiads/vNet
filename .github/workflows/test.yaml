on:
  push:
    branches:
      - "**"
jobs:
  ubuntu-test:
    name: unit tests, coverage and memcheck
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake valgrind libprotobuf-dev protobuf-compiler lcov libssl-dev
      - name: compile
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build .
      - name: run tests
        run: |
          cd build
          cmake --build . --target coverage
      - name: run memory tests
        run: |
          cd build
          cmake --build . --target memcheck

  integration:
    name: conductor, switches and agents in network namespaces
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libprotobuf-dev protobuf-compiler libssl-dev \
            iproute2 iputils-ping iptables iperf3 python3 openssl bc
      - name: compile
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target conductor switch agent vnet-state -- -j"$(nproc)"
      - name: run scenarios
        run: sudo tests/integration/run.sh build
      - name: keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: build/integration/
          if-no-files-found: ignore
